<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A free chess coach: your recent chess.com games graded by Stockfish in your browser, with the habits that cost you the most winning chances ranked and backed by real positions." />
    <meta name="theme-color" content="#161718" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <script>
      try {
        var t = localStorage.getItem("coach.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === "light" ? "#f3f3f1" : "#161718";
          });
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Prophylaxis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
