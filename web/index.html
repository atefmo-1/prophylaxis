<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal chess coach: every game from chess.com graded by Stockfish, with the habits that cost the most games ranked and backed by real positions." />
    <meta name="theme-color" content="#161718" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <script>
      try {
        var t = localStorage.getItem("coach.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Prophylaxis</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
