<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A free chess coach: your recent chess.com games graded by Stockfish in your browser, with the habits that cost you the most winning chances ranked and backed by real positions." />
    <meta name="theme-color" content="#161718" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <script>
      try {
        var t = localStorage.getItem("coach.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === "light" ? "#f3f3f1" : "#161718";
          });
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Prophylaxis</title>
    <!-- Link previews. The image is the sample player's Habits page (scripts/make-og-image.mjs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prophylaxis" />
    <meta property="og:title" content="Prophylaxis: a free chess coach for chess.com players" />
    <meta property="og:description" content="Your chess.com games reviewed by Stockfish in your browser, the habits that cost you the most, and practice from your own mistakes. Free, no account." />
    <meta property="og:url" content="https://atefmo-1.github.io/prophylaxis/" />
    <meta property="og:image" content="https://atefmo-1.github.io/prophylaxis/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Prophylaxis's Habits page for a sample player: the #1 habit, moving too fast, shown on a position from their own game" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
