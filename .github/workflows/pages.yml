# Checks the Python reference and the site, builds the static site (web/) and publishes it to GitHub Pages.
# Nothing deploys unless the checks pass.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # immutable releases since v8: no moving major tag
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  build:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The site's Brilliant and Book rules against the Python reference's recorded answers.
      - run: node scripts/check-grading.ts
        working-directory: web
      # The practice scheduler against the reference FSRS-5 implementation's recorded answers.
      - run: node scripts/check-fsrs.ts
        working-directory: web
      # Maia's board encoding and move list against the authors' code, and the shipped model against PyTorch.
      - run: node scripts/check-maia.ts ../tests/fixtures/maia.json
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
