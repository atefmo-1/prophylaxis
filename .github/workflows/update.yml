# Keeps the site current on its own: every hour it downloads new chess.com games, analyses them with
# Stockfish 19, commits the exported data and redeploys the site. Also runnable by hand from the Actions tab.
#
# The pipeline's SQLite database (games, grades and the engine's position cache) lives on the one-file
# `pipeline-db` branch, so each run only analyses games it hasn't seen.
name: Update games

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy the site even if there are no new games
        type: boolean
        default: false

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the push below can rebase onto a newer main

      # Game updates are the owner's own data, so they're committed under the owner's GitHub noreply address
      # rather than as github-actions[bot] (which would show up as a second contributor).
      - name: Commit as the repo owner
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes no major-version tag

      - name: Install Stockfish 19
        run: |
          curl -sSfL https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "STOCKFISH_PATH=$RUNNER_TEMP/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"

      - name: Restore the pipeline database
        id: restore
        run: |
          mkdir -p data
          if git fetch --depth=1 origin pipeline-db 2>/dev/null; then
            git show FETCH_HEAD:chess.db > data/chess.db
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pipeline-db branch yet: analysing every game from scratch."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download new games
        id: sync
        run: |
          out=$(uv run coach sync)
          echo "$out"
          echo "new=$(echo "$out" | grep -oE '^[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"
      - run: uv run coach analyze
      - run: uv run coach export

      - name: Commit new games
        id: commit
        run: |
          # overview.json carries a timestamp, so judge by the game list alone.
          if git diff --quiet -- web/public/data/games.json && [ -z "$(git ls-files --others --exclude-standard web/public/data)" ]; then
            echo "No new games."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add web/public/data
          git commit -m "Update games from chess.com"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save the pipeline database
        if: steps.sync.outputs.new != '0' || steps.restore.outputs.found == 'false'
        run: |
          python3 -c "import sqlite3; sqlite3.connect('data/chess.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')"
          blob=$(git hash-object -w data/chess.db)
          tree=$(printf '100644 blob %s\tchess.db\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Pipeline database")
          git push --force origin "${commit}:refs/heads/pipeline-db"

  # Pushes made with the workflow's own token don't start other workflows, so deploy from here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || inputs.deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
