[project]
name = "coach"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "atefmo-1", email = "228411487+atefmo-1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
coach = "coach:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
