[project]
name = "coach"
version = "0.1.0"
description = "A personal chess coach: grades every chess.com game with Stockfish and ranks the habits that cost you the most."
authors = [
    { name = "atefmo-1", email = "228411487+atefmo-1@users.noreply.github.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
coach = "coach:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# ml/ is its own uv project with its own tests (cd ml && uv run pytest).
testpaths = ["tests"]
